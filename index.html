<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Tic Tac Toe</h1>

      <!-- Player Name Setup Screen -->
      <div class="setup-screen" id="setupScreen">
        <h2>Enter Player Names</h2>
        <div class="input-group">
          <label for="playerXName">Player X:</label>
          <input
            type="text"
            id="playerXName"
            placeholder="Player 1"
            value="Player X"
          />
        </div>
        <div class="input-group">
          <label for="playerOName">Player O:</label>
          <input
            type="text"
            id="playerOName"
            placeholder="Player 2"
            value="Player O"
          />
        </div>
        <button id="startBtn">Start Game</button>
      </div>

      <!-- Active Game Screen (Hidden Initially) -->
      <div class="game-screen hidden" id="gameScreen">
        <div class="status" id="statusText">Player X's Turn</div>

        <div class="board" id="board">
          <div class="cell" data-index="0"></div>
          <div class="cell" data-index="1"></div>
          <div class="cell" data-index="2"></div>
          <div class="cell" data-index="3"></div>
          <div class="cell" data-index="4"></div>
          <div class="cell" data-index="5"></div>
          <div class="cell" data-index="6"></div>
          <div class="cell" data-index="7"></div>
          <div class="cell" data-index="8"></div>
        </div>

        <!-- Results Announcement Area -->
        <div class="results-banner hidden" id="resultsBanner">
          <p id="resultMessage"></p>
        </div>

        <div class="action-buttons">
          <button id="restartBtn">Restart Game</button>
          <button id="changeNamesBtn">Change Names</button>
        </div>
      </div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
